# Font Configuration
font_size 13.0

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled


# Dank color generation

cursor #dde4e3
cursor_text_color #bec9c8

foreground            #dde4e3
background            #0e1514
selection_foreground  #1b3534
selection_background  #b0cccb
url_color             #80d5d4

color0   #0e1514
color1   #f49e6e
color2   #6ad573
color3   #fff472
color4   #69cac9
color5   #1a6261
color6   #80d5d4
color7   #d2dfdf
color8   #808a8a
color9   #ffc19f
color10  #a5ffac
